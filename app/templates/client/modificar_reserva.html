<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/static/img/sabores-unidos.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Higuera · Modificar reserva</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/la-higuera.css') }}">
    <script type="module" src="{{ url_for('static', filename='javascript/main.js') }}"></script>
    <script defer src="{{ url_for('static', filename='javascript/modificar_reserva.js') }}"></script>
</head>
<body>

    <svg class="deco-leaf" viewBox="0 0 100 100" fill="none" stroke="currentColor"
         stroke-width="1.4" aria-hidden="true">
        <path d="M10 50 C 30 15, 70 15, 90 50 C 70 85, 30 85, 10 50 Z"/>
        <path d="M10 50 C 30 50, 70 50, 90 50"/>
    </svg>

    <main class="app-shell fondo">

        <header class="page-header cabecera">
            <a class="back-btn btn_volver" href="{{ url_for('cliente.mis_reservas') }}" aria-label="Volver">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 6l-6 6 6 6"/>
                </svg>
            </a>
            <span class="eyebrow">Editar</span>
            <h1 class="section-title ttlo_pagina">Modificar reserva</h1>
            <p class="section-help">Actualiza fecha, hora o detalles de tu mesa.</p>
        </header>

        <section class="cont_form">
            <form class="la-form form" method="POST"
                  action="{{ url_for('cliente.modificar_reserva', id_reserva=reserva.reserva_id) }}">

                <div class="field grupo">
                    <label class="field-label">Nombre</label>
                    <input class="field-input" type="text" name="nombre" maxlength="60" minlength="2"
                           placeholder="Nombre completo" value="{{ reserva.nombre }}" tabindex="1">
                </div>

                <div class="field grupo">
                    <label class="field-label">Cédula</label>
                    <input class="field-input" type="text" inputmode="numeric"
                           name="identificacion" value="{{ reserva.cc_cliente }}" readonly>
                </div>

                <div class="field grupo">
                    <label class="field-label">Correo</label>
                    <input class="field-input" type="email" name="email" inputmode="email"
                           placeholder="tunombre@correo.com" value="{{ reserva.email }}"
                           maxlength="60" minlength="8"
                           pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$" tabindex="2">
                </div>

                <div class="field grupo">
                    <label class="field-label">Teléfono</label>
                    <input class="field-input" type="tel" name="telefono" inputmode="tel"
                           maxlength="10" minlength="10" placeholder="3154444444"
                           pattern="[0-9]{10}" value="{{ reserva.telefono }}" tabindex="3">
                </div>

                <div class="field grupo">
                    <label class="field-label">Fecha</label>
                    <input class="field-input" type="date" name="fecha" id="input_fecha"
                           value="{{ reserva.fecha_hora.strftime('%Y-%m-%d') if reserva.fecha_hora else '' }}"
                           min="{{ (fecha_actual + timedelta(days=1)).strftime('%Y-%m-%d') }}">
                </div>

                <div class="field grupo">
                    <label class="field-label">Hora</label>
                    <input type="hidden" name="hora" id="hora_valor"
                           value="{{ reserva.fecha_hora.strftime('%H') if reserva.fecha_hora else '' }}">
                    <button type="button" id="btn_hora" class="field-button campo_hora" onclick="abrirModalHora()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.6"/>
                            <path d="M12 7v5l3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                        </svg>
                        <span id="hora_display">Seleccionar hora</span>
                    </button>
                </div>

                <div id="modal_hora" class="modal_hora_overlay oculto_hora">
                    <div class="modal_hora_caja">
                        <p class="modal_hora_ttlo">Selecciona la hora</p>
                        <div class="horas_grid" id="horas_grid"></div>
                        <button type="button" class="modal_hora_cerrar" onclick="cerrarModalHora()">Cancelar</button>
                    </div>
                </div>

                <div class="field-row fila_duo">
                    <div class="field grupo">
                        <label class="field-label">Temática</label>
                        <select class="field-select" name="tematica">
                            <option value="" disabled>Selecciona</option>
                            {% for t in tematicas %}
                            <option value="{{ t.tematica_id }}" {% if t.tematica_id == reserva.tematica_id %}selected{% endif %}>
                                {{ t.nombre_tematica }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="field grupo">
                        <label class="field-label">Personas</label>
                        <input class="field-input" type="number" name="personas" placeholder="Ej: 4"
                               max="12" min="1" value="{{ reserva.cantidad_personas }}">
                    </div>
                </div>

                <button class="btn btn--primary btn--lg btn_guardar" style="width:100%; margin-top: 14px;" type="submit">
                    Actualizar reserva
                </button>
            </form>
        </section>

    </main>

    {% set nav_active = 'reservas' %}
    {% include 'client/_partials/_navbar.html' %}

</body>
</html>
