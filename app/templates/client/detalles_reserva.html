<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Higuera · Detalles de la reserva</title>
    <link rel="icon" href="/static/img/sabores-unidos.png" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/la-higuera.css') }}">
    <script type="module" src="{{ url_for('static', filename='javascript/main.js') }}"></script>
</head>
<body>

    <svg class="deco-leaf" viewBox="0 0 100 100" fill="none" stroke="currentColor"
         stroke-width="1.4" aria-hidden="true">
        <path d="M10 50 C 30 15, 70 15, 90 50 C 70 85, 30 85, 10 50 Z"/>
        <path d="M10 50 C 30 50, 70 50, 90 50"/>
    </svg>

    <main class="app-shell" id="contenedor">

        <header class="page-header">
            <a class="back-btn" href="{{ url_for('cliente.vista_cliente') }}" aria-label="Volver">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 6l-6 6 6 6"/>
                </svg>
            </a>
            <span class="eyebrow">Reserva · Paso 2 de 2</span>
            <h1 class="section-title">Tu mesa</h1>
            <p class="section-help">Elige cuándo, cuántos y dónde quieres sentarte.</p>
        </header>

        <div id="tpl-reserva">
            <form id="form-reserva" class="la-form">

                <div class="field">
                    <label class="field-label">Fecha</label>
                    <input class="field-input" type="date" name="fec" id="v_fec" required>
                </div>

                <div class="field">
                    <label class="field-label">Bloque horario</label>
                    <button type="button" id="btn_hora_reserva" class="field-button" onclick="abrirModalHoraReserva()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.6"/>
                            <path d="M12 7v5l3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                        </svg>
                        <span id="hora_display_reserva">Seleccionar hora</span>
                    </button>
                    <input type="hidden" name="hor" id="v_hor" required>
                </div>

                <div id="modal_hora_reserva" class="modal-hora-overlay oculto-hora">
                    <div class="modal-hora-caja">
                        <p class="modal-hora-ttlo">Selecciona la hora</p>
                        <div class="modal-horas-grid" id="horas_grid_reserva"></div>
                        <button type="button" class="modal-hora-cerrar" onclick="cerrarModalHoraReserva()">Cancelar</button>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label">Temática</label>
                    <select class="field-select" name="tematica" id="v_tematica" required>
                        {% if tematicas and tematicas|length > 0 %}
                            <option value="" disabled selected>Selecciona una temática…</option>
                            {% for t in tematicas %}
                                <option value="{{ t.tematica_id }}">{{ t.nombre_tematica }}</option>
                            {% endfor %}
                        {% else %}
                            <option value="" disabled selected>Cargando temáticas…</option>
                        {% endif %}
                    </select>
                </div>

                <div class="field-row">
                    <div class="field">
                        <label class="field-label">Personas</label>
                        <input class="field-input" type="number" name="personas" value="1" max="12" min="1">
                    </div>
                    <div class="field">
                        <label class="field-label">Piso</label>
                        <select class="field-select" name="piso">
                            <option value="1">Piso 1</option>
                            <option value="2">Piso 2</option>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label">Método de pago</label>
                    <select class="field-select" name="metodo_pago" id="v_metodo_pago">
                        <option value="0">Efectivo</option>
                        <option value="1">Transferencia</option>
                    </select>
                </div>

                <label class="consent-row">
                    <input type="checkbox" name="habeas" id="habeas-datos" required>
                    <span>Autorizo el tratamiento de mis datos personales conforme a la política de Habeas Data de <em>La Higuera</em>.</span>
                </label>

                <div class="form-actions">
                    <button type="button" class="btn btn--outline btn--lg" onclick="window.location.href='/datos_cliente'">Volver</button>
                    <button type="submit" class="btn btn--primary btn--lg" id="btn-submit">Reservar</button>
                </div>
            </form>
        </div>

    </main>

    {% set nav_active = 'carrito' %}
    {% include 'client/_partials/_navbar.html' %}

</body>
</html>
